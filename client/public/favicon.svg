<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark Slate Rounded Base -->
  <rect width="64" height="64" rx="16" fill="#0A0F1D"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#059669" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Text-based Typographic 'S' Mark -->
  <text 
    x="31" 
    y="45" 
    font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="38" 
    font-weight="800" 
    fill="#FFFFFF" 
    text-anchor="middle"
    letter-spacing="-0.02em"
  >S</text>

  <!-- GovTech Emerald Pulse Accent Dot -->
  <circle cx="48" cy="18" r="5" fill="#10B981"/>
  <circle cx="48" cy="18" r="8" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.5"/>
</svg>
